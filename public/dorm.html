<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学生管理系统 - 宿舍管理</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* ===== 房态图（酒店式前台） ===== */
    .state-chips { display:inline-flex; gap:2px; background:#eef2f7; border:1px solid var(--border); padding:3px; border-radius:10px; }
    .state-chip { display:inline-flex; align-items:center; gap:6px; border:none; background:transparent; padding:5px 12px; font-size:13px; color:#475569; border-radius:8px; cursor:pointer; transition:all .15s; white-space:nowrap; }
    .state-chip:hover { color:#0f172a; }
    .state-chip.active { background:#fff; box-shadow:0 1px 3px rgba(15,23,42,.14); font-weight:600; color:#0f172a; }
    .state-chip .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
    .dot-s-empty { background:#22c55e; }
    .dot-s-part { background:#f59e0b; }
    .dot-s-full { background:#8b5cf6; }
    .dot-s-all { background:linear-gradient(90deg,#22c55e 0 33%,#f59e0b 33% 66%,#8b5cf6 66%); }

    .build-sec { margin-bottom:24px; }
    .build-h { display:flex; align-items:center; gap:10px; margin:6px 0 12px; padding-bottom:8px; border-bottom:2px solid #eef2f7; }
    .build-h .b-ic { width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,#eef2ff,#e0e7ff); color:#4f46e5; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
    .build-h .b-ic svg { width:18px; height:18px; }
    .build-h h3 { font-size:16px; margin:0; }
    .build-h .b-sum { font-size:12px; color:var(--text-light); margin-left:auto; }

    .room-map { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }

    .rtile {
      background:#fff; border:1px solid var(--border); border-top:3px solid #cbd5e1;
      border-radius:12px; padding:10px 11px; cursor:pointer;
      display:flex; flex-direction:column; gap:5px;
      transition:box-shadow .15s, transform .15s;
    }
    .rtile:hover { box-shadow:0 6px 18px rgba(15,23,42,.10); transform:translateY(-2px); }
    .rtile.st-empty { background:#f0fdf4; border-top-color:#22c55e; }
    .rtile.st-part  { background:#fffbeb; border-top-color:#f59e0b; }
    .rtile.st-full  { background:#f5f3ff; border-top-color:#8b5cf6; }

    .rt-top { display:flex; justify-content:space-between; align-items:flex-start; }
    .rt-no { font-size:18px; font-weight:800; letter-spacing:.5px; color:#0f172a; }
    .rt-g { font-size:10px; padding:1px 7px; border-radius:10px; background:#e2e8f0; color:#475569; margin-left:auto; }
    .rt-g.male { background:#dbeafe; color:#1d4ed8; }
    .rt-g.female { background:#fce7f3; color:#be185d; }
    .rt-state { display:flex; align-items:center; gap:5px; font-size:12px; font-weight:600; }
    .rt-state i { width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
    .rtile.st-empty .rt-state { color:#15803d; } .rtile.st-empty .rt-state i { background:#22c55e; }
    .rtile.st-part  .rt-state { color:#b45309; } .rtile.st-part  .rt-state i { background:#f59e0b; }
    .rtile.st-full  .rt-state { color:#6d28d9; } .rtile.st-full  .rt-state i { background:#8b5cf6; }
    .rt-free { font-size:11px; color:#64748b; }

    .rt-beds { display:flex; flex-wrap:wrap; gap:4px; margin-top:auto; padding-top:3px; }
    .rt-beds .bed { width:14px; height:14px; border-radius:50%; border:2px solid #cbd5e1; background:#fff; box-sizing:border-box; }
    .rt-beds .bed.on-male { background:#3b82f6; border-color:#3b82f6; }
    .rt-beds .bed.on-female { background:#ec4899; border-color:#ec4899; }
    .rt-beds .bed.on-unknown { background:#94a3b8; border-color:#94a3b8; }

    .empty-card {
      border:1px dashed var(--border); border-radius:16px; background:#fafbfe;
      text-align:center; padding:64px 20px; color:var(--text-light);
    }
    .empty-card .e-ic { width:56px; height:56px; border-radius:16px; background:#eef2ff; color:#6366f1; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
    .empty-card .e-ic svg { width:28px; height:28px; }
    .empty-card p { font-size:16px; color:var(--text); margin:0 0 6px; font-weight:600; }
    .empty-card .e-btn { margin-top:18px; display:flex; gap:10px; justify-content:center; }

    /* ===== 房间详情 ===== */
    #detailMask .modal { max-width:600px; }
    #detailMask .modal-header h3 { font-size:17px; margin-right:4px; }
    .dtl-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .st-pill { font-size:12px; padding:2px 10px; border-radius:20px; font-weight:600; }
    .st-pill.p-empty { background:#dcfce7; color:#15803d; }
    .st-pill.p-part { background:#fef3c7; color:#b45309; }
    .st-pill.p-full { background:#ede9fe; color:#6d28d9; }
    .dtl-sum { margin-bottom:14px; }
    .dtl-cap { display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; color:#475569; }
    .occ-bar { height:8px; background:#eef2f7; border-radius:8px; overflow:hidden; }
    .occ-bar i { display:block; height:100%; border-radius:8px; transition:width .3s; }
    .dtl-actions { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .occ-list-title { font-size:13px; font-weight:600; color:var(--text); margin-bottom:8px; }
    .occ-list-title small { color:var(--text-light); font-weight:400; margin-left:6px; }
    .dtl-occ-list { display:flex; flex-direction:column; gap:8px; max-height:38vh; overflow-y:auto; padding-right:2px; }
    .occ-row { display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-radius:10px; padding:7px 10px; background:#fff; }
    .occ-row .ava { width:32px; height:32px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
    .ava.male { background:#dbeafe; color:#1d4ed8; } .ava.female { background:#fce7f3; color:#be185d; } .ava.u { background:#f1f5f9; color:#64748b; }
    .occ-row .occ-name { font-size:14px; font-weight:600; }
    .occ-row .occ-sub { font-size:12px; color:var(--text-light); }
    .occ-right { margin-left:auto; display:flex; gap:6px; align-items:center; flex:0 0 auto; }
    .bed-no { font-size:11px; color:#6366f1; background:#eef2ff; border-radius:10px; padding:1px 8px; }
    .empty-inline { text-align:center; color:#94a3b8; font-size:13px; padding:22px 0; }

    /* ===== 补员 / 批量安排 ===== */
    #assignMask .modal { max-width:620px; }
    .assign-list { max-height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; border:1px solid #eef2f7; border-radius:8px; padding:8px; }
    .assign-item { display:flex; gap:8px; align-items:center; font-size:13px; padding:4px 6px; border-radius:8px; cursor:pointer; }
    .assign-item:hover { background:#f1f5f9; }

    /* 弹窗层级：详情在下层，编辑 / 补员 / 入住办理浮于其上 */
    #modalMask, #assignMask, #checkinMask { z-index: 1100; }

    /* ===== 入住办理 / 换房（双栏） ===== */
    .modal-ci { max-width:920px; }
    .ci-cols { display:grid; grid-template-columns:1.05fr 1fr; gap:16px; }
    @media (max-width:860px) { .ci-cols { grid-template-columns:1fr; } }
    .ci-col { border:1px solid var(--border); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; }
    .ci-col-t { font-size:13px; font-weight:700; color:var(--text); }
    .ci-col-t small { color:var(--text-light); font-weight:400; margin-left:6px; font-size:12px; }
    .ci-tool { display:flex; gap:6px; }
    .ci-tool .search-input { flex:1; width:auto; min-width:0; }
    .ci-list { max-height:292px; min-height:120px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; border:1px solid #eef2f7; border-radius:10px; padding:8px; }
    .stu-row, .room-row { display:flex; align-items:center; gap:10px; border:1px solid transparent; padding:7px 10px; border-radius:10px; cursor:pointer; transition:all .12s; }
    .stu-row:hover, .room-row:hover { background:#f8fafc; }
    .stu-row.sel, .room-row.sel { background:#eef2ff; border-color:#a5b4fc; }
    .stu-row .ava { width:30px; height:30px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; }
    .stu-name { font-size:13px; font-weight:600; line-height:1.2; }
    .stu-sub { font-size:11px; color:var(--text-light); }
    .cur-tag { margin-left:auto; font-size:10px; padding:1px 7px; border-radius:10px; background:#f1f5f9; color:#64748b; flex:0 0 auto; }
    .cur-tag.has { background:#fef3c7; color:#b45309; }
    .room-row .rbar { width:4px; align-self:stretch; border-radius:4px; flex:0 0 auto; }
    .rbar.st-empty { background:#22c55e; } .rbar.st-part { background:#f59e0b; } .rbar.st-full { background:#8b5cf6; }
    .room-main { flex:1; min-width:0; }
    .room-main b { font-size:15px; }
    .room-main .rsub { font-size:11px; color:var(--text-light); }
    .room-meta { display:flex; align-items:center; gap:6px; flex:0 0 auto; }
    .room-free { font-size:11px; font-weight:600; color:#15803d; background:#dcfce7; border-radius:10px; padding:1px 8px; white-space:nowrap; }
    .room-free.few { color:#b45309; background:#fef3c7; }
    .room-state { font-size:10px; color:#64748b; }
    .ci-hint { font-size:12px; color:#64748b; background:#f8fafc; border:1px dashed #e2e8f0; border-radius:8px; padding:6px 10px; }
    .ci-list .empty-inline { padding:16px 0; }

    /* ===== 房间编辑弹窗 ===== */
    #modalMask .modal { max-width:560px; }
    .batch-tip { font-size:12px; color:var(--text-light); margin-top:4px; }
    .tag { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:500; }
    .gender-any { background:#e2e8f0; color:#334155; } .gender-male { background:#dbeafe; color:#1d4ed8; } .gender-female { background:#fce7f3; color:#be185d; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <svg class="logo-icon" data-site-logo viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v14"/><path d="M7 21v-5h10v5"/><path d="M10 6h4M10 9h4M10 12h4"/></svg>
        <div>
          <h1 data-site-name>学生管理系统</h1>
          <p class="subtitle">宿舍房态 · 入住 / 换房 / 退宿管理</p>
        </div>
      </div>
      <nav class="nav">
        <a href="/" class="nav-item">数据总览</a>
        <a href="/students.html" class="nav-item">学生档案</a>
        <a href="/classes.html" class="nav-item">班级管理</a>
        <a href="/grades.html" class="nav-item">年级管理</a>
        <a href="/teachers.html" class="nav-item">教师管理</a>
        <a href="/exams.html" class="nav-item">成绩管理</a>
        <a href="/conduct.html" class="nav-item">考勤操行</a>
        <a href="/dorm.html" class="nav-item active">宿舍管理</a>
        <a href="/allocate.html" class="nav-item">智能分班</a>
        <a href="/settings.html" class="nav-item">系统设置</a>
        <a class="site-web" data-site-web hidden target="_blank" rel="noopener" title="打开学校官网">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          <span>官网</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- 总览统计 -->
    <section class="stats">
      <div class="stat-card"><div class="stat-num" id="sBuildings">0</div><div class="stat-label">楼栋</div></div>
      <div class="stat-card"><div class="stat-num" id="sRooms">0</div><div class="stat-label">房间</div></div>
      <div class="stat-card"><div class="stat-num" id="sBeds">0</div><div class="stat-label">床位</div></div>
      <div class="stat-card"><div class="stat-num" id="sIn">0</div><div class="stat-label">在住</div></div>
      <div class="stat-card"><div class="stat-num" id="sRate">0%</div><div class="stat-label">入住率</div></div>
    </section>

    <!-- 房态工具栏 -->
    <section class="toolbar">
      <div class="toolbar-left">
        <div class="state-chips" id="stateChips">
          <button type="button" class="state-chip active" data-state="all"><i class="dot dot-s-all"></i>全部</button>
          <button type="button" class="state-chip" data-state="empty"><i class="dot dot-s-empty"></i>空房</button>
          <button type="button" class="state-chip" data-state="part"><i class="dot dot-s-part"></i>部分入住</button>
          <button type="button" class="state-chip" data-state="full"><i class="dot dot-s-full"></i>满房</button>
        </div>
        <select id="buildFilter" class="grade-filter"><option value="">全部楼栋</option></select>
        <input type="text" id="roomSearch" class="search-input" placeholder="搜索房号 / 楼栋" style="width:190px" />
      </div>
      <div class="toolbar-right">
        <button class="btn btn-primary" id="btnCheckin">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg> 办理入住
        </button>
        <button class="btn btn-outline" id="btnAddRoom">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 添加房间
        </button>
      </div>
    </section>

    <!-- 房态图 -->
    <div id="roomGroups"></div>
  </main>

  <!-- 房间 添加 / 编辑 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <div class="modal-header"><h3 id="roomModalTitle">添加房间</h3>
        <button class="modal-close" id="modalClose"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <form class="modal-body" id="roomForm">
        <input type="hidden" id="rId" />
        <div class="form-grid">
          <div class="form-row"><label class="form-label">楼栋名称</label><input type="text" id="rBuilding" list="buildList" placeholder="如：1号楼" /></div>
          <div class="form-row"><label class="form-label">房号 <span class="req">*</span></label><input type="text" id="rRoomNo" placeholder="如：101" /></div>
          <div class="form-row"><label class="form-label">床位容量</label><input type="number" id="rCapacity" min="1" max="100" value="4" /></div>
          <div class="form-row"><label class="form-label">宿舍类型</label>
            <select id="rGender"><option value="any">不限（混合）</option><option value="male">男生宿舍</option><option value="female">女生宿舍</option></select>
          </div>
          <div class="form-row"><label class="form-label">生成间数 <span class="req">*</span></label>
            <input type="number" id="rCount" min="1" max="50" value="1" />
            <div class="batch-tip">填 2 及以上时，按房号依次批量生成，例如起始 101 生成 4 间 → 101/102/103/104</div>
          </div>
        </div>
        <datalist id="buildList"></datalist>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" id="modalCancel">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 房间详情 -->
  <div class="modal-mask" id="detailMask">
    <div class="modal">
      <div class="modal-header">
        <div class="dtl-head">
          <h3 id="dtlTitle">房间详情</h3>
          <span class="tag gender-any" id="dtlGender"></span>
          <span class="st-pill p-empty" id="dtlState"></span>
        </div>
        <button class="modal-close" id="detailClose"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="dtl-sum">
          <div class="dtl-cap"><span>在住 <b id="dtlOcc">0</b> / <b id="dtlCap">0</b> 人</span><span id="dtlFree"></span></div>
          <div class="occ-bar"><i id="dtlBar" style="width:0%"></i></div>
        </div>
        <div class="dtl-actions">
          <button class="btn btn-primary btn-sm" id="btnDetailAssign">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg> 补员入住
          </button>
          <button class="btn btn-default btn-sm" id="btnDetailEdit">编辑房间</button>
          <button class="btn btn-default btn-sm" id="btnDetailClear">清空房间</button>
          <button class="btn btn-outline btn-sm danger-text" id="btnDetailDel">删除房间</button>
        </div>
        <div class="occ-list-title">入住学生<small id="dtlSub"></small></div>
        <div class="dtl-occ-list" id="dtlOccList"></div>
      </div>
    </div>
  </div>

  <!-- 补员：多选安排入住 -->
  <div class="modal-mask" id="assignMask">
    <div class="modal">
      <div class="modal-header"><h3 id="assignTitle">安排入住</h3>
        <button class="modal-close" id="assignClose"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <p class="ci-hint" id="assignHint" style="margin:0 0 10px"></p>
        <div class="ci-tool" style="margin-bottom:8px">
          <input type="text" id="assignSearch" class="search-input" placeholder="搜索姓名 / 学号" />
          <select id="assignGrade" class="grade-filter"><option value="">全部年级</option></select>
        </div>
        <div class="assign-list" id="assignList"></div>
        <div class="modal-footer">
          <span class="dim-text" id="assignCount" style="margin-right:auto;font-size:12px"></span>
          <button type="button" class="btn btn-default" id="assignCancel">取消</button>
          <button type="button" class="btn btn-primary" id="btnDoAssign">确认入住</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 入住办理 / 换房 -->
  <div class="modal-mask" id="checkinMask">
    <div class="modal modal-ci">
      <div class="modal-header"><h3 id="checkinTitle">办理入住</h3>
        <button class="modal-close" id="checkinClose"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="ci-cols">
          <div class="ci-col">
            <div class="ci-col-t">1. 选择学生<small>搜索并按学生办理入住 / 换房</small></div>
            <div class="ci-tool">
              <input type="text" id="ciSearch" class="search-input" placeholder="姓名 / 学号 / 班级" autocomplete="off" />
              <select id="ciGrade" class="grade-filter"><option value="">全部年级</option></select>
            </div>
            <div class="ci-list" id="ciStuList"></div>
          </div>
          <div class="ci-col">
            <div class="ci-col-t">2. 选择房间<small>仅显示有空床且性别相符的房间</small></div>
            <div class="ci-hint" id="ciHint"></div>
            <div class="ci-list" id="ciRoomList"></div>
          </div>
        </div>
        <div class="modal-footer">
          <span class="dim-text" id="ciMeta" style="margin-right:auto;font-size:12px"></span>
          <button type="button" class="btn btn-default" id="ciCancel">取消</button>
          <button type="button" class="btn btn-primary" id="btnCiGo">确认入住</button>
        </div>
      </div>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学生管理系统 - 学生档案</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* 学生档案弹窗宽一些，容纳档案 + 成绩字段 */
    #modalMask .modal { max-width: 900px; }
    .arch-group-title {
      grid-column: 1 / -1; font-size: 13px; color: #6b7280; font-weight: 600;
      margin: 8px 0 12px; padding-top: 8px; border-top: 1px dashed var(--border, #e5e7eb);
    }
    .arch-group-title:first-of-type { border-top: none; padding-top: 0; }
    /* 成绩网格：移出内联样式以支持响应式断点 */
    .score-grid {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 18px;
    }
    @media (max-width: 720px) {
      .score-grid { grid-template-columns: 1fr; }
    }
    .table-wrap { overflow-x: auto; }
    .student-table { min-width: 0; }
    /* 宿舍列：绿色入住胶囊 / 虚线空态 */
    .dorm-cell { white-space: nowrap; }
    .dorm-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: #ecfdf5; border: 1px solid #a7f3d0; color: #047857;
      font-size: 12px; font-weight: 600; line-height: 1;
      padding: 5px 10px; border-radius: 999px; cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .dorm-chip:hover { background: #d1fae5; border-color: #6ee7b7; }
    .dorm-chip.dorm-empty {
      background: #f8fafc; border: 1px dashed #cbd5e1; color: #94a3b8; font-weight: 500;
    }
    .dorm-chip.dorm-empty:hover { border-color: var(--primary); color: var(--primary); background: #eef2ff; }
    /* 宿舍弹窗 */
    #dormMask .modal { max-width: 760px; }
    .dorm-stu { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      background: #f8fafc; border: 1px solid #eef2f7; border-radius: 12px;
      padding: 10px 14px; margin-bottom: 12px; }
    .dorm-stu-avatar {
      flex: 0 0 42px; width: 42px; height: 42px; border-radius: 50%; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #93c5fd, #3b82f6); color: #fff;
      font-size: 18px; font-weight: 700;
    }
    .dorm-stu-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .di-main { flex: 1; min-width: 200px; }
    .di-name { display: flex; align-items: center; gap: 6px; }
    .di-name strong { font-size: 15px; }
    .di-sub { color: #64748b; font-size: 12px; margin-top: 3px; }
    .di-cur { font-size: 12.5px; color: #64748b; }
    .di-cur b { color: var(--text); }
    #dormSearch { width: 100%; margin-bottom: 10px; }
    #batchDormSearch { width: 100%; margin-bottom: 10px; }
    .dorm-pick-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr));
      gap: 10px; max-height: 360px; overflow: auto; padding: 2px;
    }
    .dorm-room {
      position: relative; border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 12px; background: #fff; cursor: pointer; user-select: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .dorm-room:hover { border-color: #a5b4fc; }
    .dorm-room.selected { border-color: var(--primary); background: #eef2ff; box-shadow: inset 0 0 0 1px var(--primary); }
    .dorm-room.disabled { opacity: .55; cursor: not-allowed; background: #f8fafc; }
    .dorm-room .dr-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .dr-name b { font-size: 14px; }
    .dr-name .dr-no { color: #64748b; font-size: 12px; font-weight: 600; margin-left: 4px; }
    .dgender { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.6; }
    .dgender.g-male { background: #dbeafe; color: #1d4ed8; }
    .dgender.g-female { background: #fce7f3; color: #be185d; }
    .dgender.g-any { background: #e2e8f0; color: #334155; }
    .dr-cap { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: #64748b; margin: 8px 0 6px; }
    .dr-tags { display: inline-flex; gap: 4px; }
    .dr-tag { font-size: 10.5px; padding: 0 6px; border-radius: 999px; }
    .dr-tag.dr-cur { background: #dcfce7; color: #166534; }
    .dr-tag.dr-full { background: #fef2f2; color: #b91c1c; }
    .dr-bar { height: 5px; border-radius: 5px; background: #eef2f7; overflow: hidden; }
    .dr-bar i { display: block; height: 100%; background: linear-gradient(90deg, #6366f1, #22d3ee); border-radius: 5px; }
    .dr-check {
      position: absolute; top: 8px; right: 8px; width: 18px; height: 18px;
      border-radius: 50%; background: var(--primary); color: #fff;
      font-size: 12px; display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: scale(.6); transition: .15s;
    }
    .dorm-room.selected .dr-check { opacity: 1; transform: none; }
    .dorm-empty-tip { text-align: center; color: #64748b; padding: 46px 10px;
      display: flex; flex-direction: column; gap: 14px; align-items: center; }
    .dorm-empty-tip p { margin: 0; }
    .btn-leave { background: #fff; border: 1px solid #fecaca; color: var(--danger); }
    .btn-leave:hover:not(:disabled) { background: #fef2f2; border-color: #fca5a5; }

    /* ===== 宿舍列：酒店式房态小卡（床位点阵） ===== */
    .dorm-cell { white-space: nowrap; vertical-align: middle; }
    .dorm-mini {
      display: inline-flex; flex-direction: column; gap: 5px; min-width: 148px; max-width: 180px;
      border: 1px solid var(--border); border-top: 3px solid #94a3b8; border-radius: 11px;
      padding: 6px 9px 7px; background: #fff; cursor: pointer; text-align: left;
      transition: box-shadow .15s, transform .15s;
    }
    .dorm-mini:hover { box-shadow: 0 5px 14px rgba(15, 23, 42, .10); transform: translateY(-1px); }
    .dorm-mini.dm-empty { background: #f0fdf4; border-top-color: #22c55e; }
    .dorm-mini.dm-part { background: #fffbeb; border-top-color: #f59e0b; }
    .dorm-mini.dm-full { background: #f5f3ff; border-top-color: #8b5cf6; }
    .dm-head { display: flex; align-items: baseline; gap: 5px; }
    .dm-bld { font-size: 11px; color: #64748b; }
    .dm-no { font-size: 16px; font-weight: 800; letter-spacing: .5px; color: #0f172a; }
    .dm-st { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; }
    .dm-st i { width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; }
    .dorm-mini.dm-empty .dm-st { color: #15803d; } .dorm-mini.dm-empty .dm-st i { background: #22c55e; }
    .dorm-mini.dm-part .dm-st { color: #b45309; } .dorm-mini.dm-part .dm-st i { background: #f59e0b; }
    .dorm-mini.dm-full .dm-st { color: #6d28d9; } .dorm-mini.dm-full .dm-st i { background: #8b5cf6; }
    .dm-foot { display: flex; align-items: center; gap: 8px; margin-top: 1px; }
    .dm-free { font-size: 10.5px; color: #64748b; }
    .dm-fulltxt { font-size: 10.5px; font-weight: 700; color: #6d28d9; }
    .dm-act {
      margin-left: auto; border: none; background: #eef2ff; color: #4f46e5;
      font-size: 10.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
      cursor: pointer; line-height: 1.6;
    }
    .dm-act:hover { background: #e0e7ff; }

    /* 床位点阵（表格小卡 / 选择弹窗卡片共用）：每个床位为一个小床图标 */
    .bed-dots { display: flex; flex-wrap: wrap; gap: 3px 6px; }
    .bed-dots i { width: 15px; height: 12px; display: inline-flex; font-style: normal; color: #c2ccd9; }
    .bed-dots i svg { width: 100%; height: 100%; display: block; }
    .bed-dots.mini i { width: 12px; height: 10px; }
    .bed-dots i.on-male { color: #3b82f6; }
    .bed-dots i.on-female { color: #ec4899; }
    .bed-dots i.on-u { color: #94a3b8; }
    .bed-dots i.me { outline: 2px solid #6366f1; outline-offset: 1px; border-radius: 4px; }

    /* ===== 宿舍选择弹窗：酒店式房态配色（空绿 / 部分橙 / 满紫） ===== */
    .dorm-room.lv-empty { background: #f0fdf4; border-top: 3px solid #22c55e; }
    .dorm-room.lv-part { background: #fffbeb; border-top: 3px solid #f59e0b; }
    .dorm-room.lv-full { background: #f5f3ff; border-top: 3px solid #8b5cf6; }
    .dorm-room.selected { background: #eef2ff !important; border-top-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
    .dorm-room .dr-dots { margin: 4px 0 2px; }
    .dr-free { font-size: 11px; color: #64748b; }
    .dr-free-full { font-size: 11px; font-weight: 700; color: #6d28d9; }
    .dr-tag.dr-empty { background: #dcfce7; color: #15803d; }
    .dr-tag.dr-part { background: #fef3c7; color: #b45309; }
    .dr-tag.dr-full { background: #ede9fe; color: #6d28d9; }

    /* ===== 编辑档案里的「住宿信息」区块 ===== */
    .stu-dorm-box { margin-bottom: 14px; }
    .sdb-card {
      border: 1px solid var(--border); border-left: 4px solid #cbd5e1; border-radius: 14px;
      padding: 12px 14px; background: #fff; display: flex; flex-direction: column; gap: 10px;
    }
    .sdb-card.lv-empty { border-left-color: #22c55e; }
    .sdb-card.lv-part { border-left-color: #f59e0b; }
    .sdb-card.lv-full { border-left-color: #8b5cf6; }
    .sdb-top { display: flex; align-items: center; gap: 8px; }
    .sdb-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .sdb-state {
      margin-left: auto;
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 11px; border-radius: 999px;
      font-size: 12px; font-weight: 700; line-height: 1.5; white-space: nowrap;
    }
    .sdb-state::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: 0 0 auto;
    }
    .sdb-state.st-empty { background: #dcfce7; color: #15803d; }
    .sdb-state.st-part { background: #fef3c7; color: #b45309; }
    .sdb-state.st-full { background: #ede9fe; color: #6d28d9; }
    .sdb-state.st-none { background: #f1f5f9; color: #64748b; }
    .sdb-hint { font-size: 12px; color: #64748b; }
    .sdb-room {
      display: flex; flex-direction: column; gap: 6px; background: #fff;
      border: 1px solid #eef2f7; border-radius: 10px; padding: 10px 12px;
    }
    .sdb-name { display: flex; align-items: center; gap: 6px; }
    .sdb-name b { font-size: 17px; color: #0f172a; }
    .sdb-name em { font-style: normal; color: #64748b; font-weight: 600; font-size: 13px; }
    .sdb-bedno { margin-left: auto; font-size: 11px; color: #6366f1; background: #eef2ff; border-radius: 10px; padding: 1px 9px; }
    .sdb-occ { font-size: 11.5px; color: #64748b; }
    .sdb-roomies-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 7px; }
    .sdb-rm {
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);
      background: #f8fafc; border-radius: 999px; padding: 3px 11px 3px 4px; margin: 0 6px 6px 0;
      font-size: 12px; font-weight: 600; color: #0f172a;
    }
    .sdb-rm .ava { width: 20px; height: 20px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10px; }
    .sdb-rm .ava.male { background: #dbeafe; color: #1d4ed8; }
    .sdb-rm .ava.female { background: #fce7f3; color: #be185d; }
    .sdb-rm .ava.u { background: #f1f5f9; color: #64748b; }
    .sdb-rm.me { background: #eef2ff; border-color: #a5b4fc; }
    .sdb-rm .rm-sub { font-size: 10px; font-weight: 400; color: var(--text-light); margin-left: 2px; }
    .sdb-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ===== 安排入班 / 转班弹窗 ===== */
    #assignMask .modal { max-width: 560px; }
    .assign-stu {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      background: #f8fafc; border: 1px solid #eef2f7; border-radius: 12px;
      padding: 10px 14px; margin-bottom: 12px;
    }
    .assign-pick { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .assign-pick label {
      font-size: 13px; color: #6b7280; font-weight: 600;
      flex: 0 0 auto; white-space: nowrap;
    }
    .assign-pick select {
      flex: 1; min-width: 0; padding: 8px 10px;
      border: 1px solid var(--border, #d1d5db); border-radius: 8px;
      font-size: 13px; background: #fff; color: var(--text, #1f2937);
    }
    .assign-pick select:focus { outline: none; border-color: var(--primary, #4f6df5); box-shadow: 0 0 0 3px rgba(79, 109, 245, .12); }
    .assign-tip { font-size: 12px; color: #64748b; margin: 6px 0 0; line-height: 1.7; }
    .btn-sm.btn-assign { background: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe; }
    .btn-sm.btn-assign:hover:not(:disabled) { background: #e0e7ff; border-color: #a5b4fc; }

    /* ===== 学生列表：紧凑排版 + 观感优化 ===== */
    .student-table th { white-space: nowrap; }
    .student-table td { white-space: nowrap; }
    .student-table .stu-name { color: var(--text, #1f2937); font-weight: 600; }
    .grade-text { color: #6b7280; }
    .class-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: #eef2ff; color: #4338ca; font-size: 12px; font-weight: 600;
      padding: 2px 10px; border-radius: 999px; border: 1px solid #e0e7ff;
    }
    .empty-cell { color: #cbd5e1; }
    .score { text-align: right; font-variant-numeric: tabular-nums; }
    .no-score { color: #d1d5db; }
    .total-score { text-align: right; font-variant-numeric: tabular-nums; color: var(--primary); font-weight: 700; }

    /* 状态标签：带状态圆点 + 柔和底色 */
    .student-table .status-tag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 12px 3px 9px; border-radius: 999px; font-size: 12px; line-height: 1;
    }
    .student-table .status-tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .student-table .status-allocated { background: #ecfdf5; color: #047857; }
    .student-table .status-unallocated { background: #fef3c7; color: #b45309; }

    /* 特长：柔紫胶囊 */
    .student-table .specialty-tag {
      background: #f5f3ff; color: #6d28d9; border: 1px solid #ede9fe;
      border-radius: 999px; padding: 2px 10px; font-size: 12px; display: inline-block;
      max-width: 130px; overflow: hidden; text-overflow: ellipsis; vertical-align: middle;
    }

    /* 斑马纹 + 悬停 */
    .student-table tbody tr:nth-child(even) td { background: #f8fafc; }
    .student-table tbody tr:hover td { background: #eef2ff; }
    .student-table tbody tr { transition: background .15s; }
    .student-table td { transition: background-color .12s; }

    /* 操作列：单颗「⋯」按钮 + 行下拉菜单 */
    .student-table .row-actions { display: flex; justify-content: center; }
    .act-more {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; padding: 0; border-radius: 8px;
      border: 1px solid var(--border, #e5e7eb); background: #fff;
      color: #94a3b8; cursor: pointer; transition: all .15s;
    }
    .act-more svg { width: 17px; height: 17px; }
    .act-more:hover { color: var(--primary); border-color: var(--primary); background: #eef2ff; box-shadow: 0 2px 8px rgba(79,70,229,.16); }

    .row-menu {
      position: fixed; z-index: 1300; min-width: 178px; padding: 6px;
      background: #fff; border: 1px solid var(--border, #e5e7eb); border-radius: 12px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, .16);
      display: none; transform-origin: top right;
    }
    .row-menu.show { display: block; animation: rowMenuIn .12s ease; }
    @keyframes rowMenuIn {
      from { opacity: 0; transform: scale(.96) translateY(-3px); }
      to { opacity: 1; transform: none; }
    }
    .row-menu-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 8px 10px; border: none; background: none; border-radius: 8px;
      font-size: 13px; color: var(--text, #1f2937); cursor: pointer; text-align: left;
      font-family: inherit; transition: background .12s;
    }
    .row-menu-item:hover { background: #f1f5f9; color: var(--primary); }
    .row-menu-item .menu-ico { display: inline-flex; color: #94a3b8; }
    .row-menu-item:hover .menu-ico { color: var(--primary); }
    .row-menu-item .menu-ico svg { width: 15px; height: 15px; }
    .row-menu-item.danger { color: #dc2626; }
    .row-menu-item.danger:hover { background: #fef2f2; color: #b91c1c; }
    .row-menu-item.danger:hover .menu-ico { color: #dc2626; }
    .row-menu-item.danger .menu-ico { color: #f87171; }
    .menu-sep { height: 1px; background: var(--border, #e5e7eb); margin: 5px 6px; }

    /* 列设置下拉 */
    #colDropdown .dropdown-menu { min-width: 176px; }
    .col-menu { padding: 8px; }
    .col-head { display: flex; gap: 6px; margin-bottom: 6px; padding-bottom: 8px; border-bottom: 1px solid var(--border, #e5e7eb); }
    .col-btn {
      flex: 1; padding: 5px 8px; border-radius: 7px; cursor: pointer;
      background: #fff; border: 1px solid var(--border, #e5e7eb); color: #64748b;
      font-size: 12px; transition: all .15s;
    }
    .col-btn:hover { color: var(--primary); border-color: var(--primary); background: #eef2ff; }
    .col-list { max-height: 48vh; overflow: auto; display: flex; flex-direction: column; gap: 1px; }
    .col-item {
      display: flex; align-items: center; gap: 8px; padding: 5px 8px;
      border-radius: 6px; font-size: 13px; color: var(--text); cursor: pointer; user-select: none;
    }
    .col-item:hover { background: #f1f5f9; }
    .col-item input { width: 15px; height: 15px; accent-color: var(--primary); cursor: pointer; margin: 0; }
    .col-item.col-subject { margin-left: 8px; color: #475569; }
    .col-item.is-locked { opacity: .6; cursor: not-allowed; }
    .col-item.is-locked:hover { background: transparent; }

    /* ===== 多选列 + 批量操作条 ===== */
    .student-table th.check-col,
    .student-table td.check-col { width: 44px; text-align: center; padding-left: 4px; padding-right: 4px; }
    .student-table input[type="checkbox"] {
      width: 15px; height: 15px; margin: 0; cursor: pointer;
      accent-color: var(--primary); vertical-align: middle;
    }
    .student-table tbody tr.row-selected td { background: #eef2ff; }
    .student-table tbody tr.row-selected td:first-child { box-shadow: inset 3px 0 0 var(--primary); }
    .bulk-bar {
      position: fixed; left: 50%; bottom: 26px; z-index: 1200;
      transform: translate(-50%, 20px);
      display: none; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: 999px;
      background: rgba(255, 255, 255, .97);
      border: 1px solid var(--border, #e5e7eb);
      box-shadow: 0 14px 38px rgba(15, 23, 42, .18);
      backdrop-filter: blur(6px);
    }
    .bulk-bar.show { display: flex; animation: bulkBarIn .18s ease forwards; }
    @keyframes bulkBarIn {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .bulk-count { font-size: 13px; font-weight: 700; color: var(--primary); white-space: nowrap; padding: 0 4px; }
    .bulk-sep { width: 1px; height: 20px; background: var(--border, #e5e7eb); margin: 0 2px; }
    @media (max-width: 640px) {
      .bulk-bar { left: 10px; right: 10px; bottom: 12px; transform: none; flex-wrap: wrap;
        justify-content: center; border-radius: 16px; padding: 10px; }
      .bulk-bar.show { animation: none; }
    }

    /* ===== 批量分班 / 批量分宿舍弹窗内的已选学生概览 ===== */
    .batch-sum-top { font-size: 13px; color: #64748b; margin-bottom: 8px; }
    .batch-sum-top strong { color: var(--primary); font-size: 15px; }
    .batch-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 96px; overflow: auto; }
    .batch-chip {
      display: inline-flex; align-items: baseline; gap: 5px;
      background: #f8fafc; border: 1px solid var(--border, #e5e7eb);
      border-radius: 999px; padding: 3px 11px; font-size: 12px; color: var(--text, #1f2937);
      white-space: nowrap;
    }
    .batch-chip b { font-weight: 600; }
    .batch-chip em { font-style: normal; color: #94a3b8; font-size: 11px; }
    .batch-chip-more { background: #eef2ff; border-color: #e0e7ff; color: #4338ca; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <svg class="logo-icon" data-site-logo viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1 2 3 6 3s6-2 6-3v-5"/></svg>
        <div>
          <h1 data-site-name>学生管理系统</h1>
          <p class="subtitle">学生档案 · 学籍信息管理</p>
        </div>
      </div>
      <nav class="nav">
        <a href="/dashboard.html" class="nav-item">数据总览</a>
        <a href="/students.html" class="nav-item active">学生档案</a>
        <a href="/classes.html" class="nav-item">班级管理</a>
        <a href="/grades.html" class="nav-item">年级管理</a>
        <a href="/teachers.html" class="nav-item">教师管理</a>
        <a href="/exams.html" class="nav-item">成绩管理</a>
        <a href="/conduct.html" class="nav-item">考勤操行</a>
        <a href="/dorm.html" class="nav-item">宿舍管理</a>
        <a href="/allocate.html" class="nav-item">智能分班</a>
        <a href="/settings.html" class="nav-item">系统设置</a>
        <a class="site-web" data-site-web hidden target="_blank" rel="noopener" title="打开学校官网">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          <span>官网</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- 统计卡片 -->
    <section class="stats">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">总人数</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statMale">0</div>
        <div class="stat-label">男生</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statFemale">0</div>
        <div class="stat-label">女生</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statAvg">0</div>
        <div class="stat-label">平均总分</div>
      </div>
    </section>

    <!-- 操作工具栏 -->
    <section class="toolbar">
      <div class="toolbar-left">
        <input type="text" id="searchInput" class="search-input" placeholder="搜索姓名 / 学号 / 特长..." />
        <select id="gradeFilter" class="grade-filter">
          <option value="">全部年级</option>
        </select>
        <select id="statusFilter" class="grade-filter">
          <option value="">全部状态</option>
          <option value="unallocated">未分班</option>
          <option value="allocated">已分班</option>
        </select>
        <select id="dormFilter" class="grade-filter">
          <option value="">全部住宿</option>
          <option value="in">已入住</option>
          <option value="out">未入住</option>
        </select>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-primary" id="btnAdd"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 添加学生</button>
        <button class="btn btn-outline" id="btnTrash" title="误删的学生在这里恢复，也可彻底删除"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg> 回收站</button>
        <div class="dropdown" id="colDropdown">
          <button class="btn btn-outline" id="btnCols" type="button"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg> 列设置 <svg class="btn-icon btn-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
          <div class="dropdown-menu col-menu" id="colMenu"></div>
        </div>
        <div class="dropdown" id="moreDropdown">
          <button class="btn btn-outline" id="btnMore"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg> 更多 <svg class="btn-icon btn-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
          <div class="dropdown-menu" id="moreMenu">
            <button class="dropdown-item" id="btnImport"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 批量导入示例</button>
            <button class="dropdown-item" id="btnDownloadTpl" title="下载 CSV 格式的示例表格，可用 Excel 编辑后导入"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"/></svg> 下载示例表格</button>
            <button class="dropdown-item" id="btnImportFile" title="导入 CSV 表格文件（支持导入学籍档案列，详见示例表格）"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> 导入表格数据</button>
          </div>
        </div>
        <input type="file" id="importFileInput" accept=".csv,text/csv" hidden />
      </div>
    </section>

    <!-- 学生表格 -->
    <section class="table-wrap">
      <table class="student-table">
        <thead id="stuThead"></thead>
        <tbody id="studentTbody">
          <tr><td colspan="20" class="empty-tip">加载中...</td></tr>
        </tbody>
      </table>
    </section>

    <!-- 分页 -->
    <section class="pagination" id="pagination"></section>
  </main>

  <!-- 学生编辑弹窗 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal" id="stuModal">
      <div class="modal-header">
        <h3 id="modalTitle">添加学生</h3>
        <button class="modal-close" id="modalClose"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <form class="modal-body" id="stuForm">
        <input type="hidden" id="fId" />
        <div id="stuDormBox" class="stu-dorm-box" hidden></div>
        <div class="form-row">
          <label class="form-label">照片URL</label>
          <input type="text" id="fPhoto" placeholder="留空使用默认头像" />
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label class="form-label">学号 <span class="req">*</span></label>
            <input type="text" id="fStudentId" required placeholder="请输入学号" />
          </div>
          <div class="form-row">
            <label class="form-label">年级</label>
            <select id="fGrade"></select>
          </div>
          <div class="form-row">
            <label class="form-label">姓名 <span class="req">*</span></label>
            <input type="text" id="fName" required placeholder="请输入姓名" />
          </div>
          <div class="form-row">
            <label class="form-label">性别</label>
            <select id="fGender">
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </div>

          <div class="arch-group-title">学籍档案信息</div>
          <div class="form-row">
            <label class="form-label">学籍号</label>
            <input type="text" id="fArchNo" placeholder="全国学籍号" />
          </div>
          <div class="form-row">
            <label class="form-label">身份证号</label>
            <input type="text" id="fIdCard" placeholder="18 位身份证号" />
          </div>
          <div class="form-row">
            <label class="form-label">出生日期</label>
            <input type="date" id="fBirthday" />
          </div>
          <div class="form-row">
            <label class="form-label">民族</label>
            <input type="text" id="fNation" placeholder="如：汉族" />
          </div>
          <div class="form-row">
            <label class="form-label">户籍所在地</label>
            <input type="text" id="fNativePlace" placeholder="如：XX省XX市" />
          </div>
          <div class="form-row">
            <label class="form-label">入学日期</label>
            <input type="date" id="fEnrollDate" />
          </div>
          <div class="form-row form-row-full">
            <label class="form-label">家庭住址</label>
            <input type="text" id="fAddress" placeholder="详细家庭住址" />
          </div>
          <div class="form-row">
            <label class="form-label">监护人</label>
            <input type="text" id="fGuardian" placeholder="监护人姓名" />
          </div>
          <div class="form-row">
            <label class="form-label">监护人电话</label>
            <input type="text" id="fGuardianPhone" placeholder="联系电话" />
          </div>
          <div class="form-row">
            <label class="form-label">与监护人关系</label>
            <select id="fGuardianRel">
              <option value="">请选择</option>
              <option value="父亲">父亲</option>
              <option value="母亲">母亲</option>
              <option value="祖父/外祖父">祖父/外祖父</option>
              <option value="祖母/外祖母">祖母/外祖母</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="form-row form-row-full">
            <label class="form-label">备注</label>
            <input type="text" id="fRemark" placeholder="备注（如健康情况、注意事项等）" />
          </div>

          <div class="arch-group-title" id="scoreTitle">当前成绩（用作分班 / 均衡参考，可来自某次考试“同步到档案”）</div>
          <div id="scoreGrid" class="score-grid"></div>

          <div class="form-row form-row-full">
            <label class="form-label">特长</label>
            <input type="text" id="fSpecialty" placeholder="如：篮球、钢琴、绘画..." />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" id="modalCancel">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 安排入班 / 转班弹窗 -->
  <div class="modal-mask" id="assignMask">
    <div class="modal">
      <div class="modal-header">
        <h3 id="assignTitle">安排入班</h3>
        <button class="modal-close" id="assignClose" type="button"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="assign-stu" id="assignStuInfo"></div>
        <div class="assign-pick">
          <label for="assignSelect">目标班级</label>
          <select id="assignSelect"></select>
        </div>
        <p class="assign-tip" id="assignTip"></p>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" id="assignCancel">取消</button>
          <button type="button" class="btn btn-primary" id="assignSave">确认入班</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 宿舍分配 / 更换 / 退宿弹窗 -->
  <div class="modal-mask" id="dormMask">
    <div class="modal">
      <div class="modal-header">
        <h3 id="dormTitle">分配宿舍</h3>
        <button class="modal-close" id="dormClose" type="button"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="dorm-stu" id="dormStuInfo"></div>
        <input type="text" id="dormSearch" class="search-input" placeholder="搜索楼栋 / 房号，快速定位宿舍" />
        <div class="dorm-pick-list" id="dormList"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-leave" id="btnDormLeave" hidden>退宿</button>
          <span class="dim" id="dormTip" style="margin-right:auto;font-size:12px"></span>
          <button type="button" class="btn btn-default" id="dormCancel">取消</button>
          <button type="button" class="btn btn-primary" id="btnDormSave">确认入住</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 学籍异动弹窗 -->
  <div class="modal-mask" id="enrollMask">
    <div class="modal">
      <div class="modal-header">
        <h3>学籍状态 / 异动</h3>
        <button class="modal-close" id="enrollX" type="button"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="enroll-info" id="enrollInfo"></div>
        <div class="form-row">
          <label class="form-label">变更为</label>
          <select id="enrollStatus"></select>
        </div>
        <div class="form-row">
          <label class="form-label">备注（可选）</label>
          <input type="text" id="enrollNote" placeholder="如：因病休学一学期、转学至外地等" />
        </div>
        <div class="enroll-history-title">异动记录</div>
        <div class="enroll-history" id="enrollHistory"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" id="enrollCancel">取消</button>
        <button type="button" class="btn btn-primary" id="btnEnrollSave">保存变更</button>
      </div>
    </div>
  </div>

  <!-- 回收站弹窗 -->
  <div class="modal-mask" id="trashMask">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3>回收站 · 已删除学生</h3>
        <button class="modal-close" id="trashClose" type="button"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="trash-top">
          <input type="text" id="trashKw" class="search-input" placeholder="搜索姓名 / 学号 / 班级..." />
          <span class="trash-count" id="trashCount">0</span>
        </div>
        <div class="trash-list" id="trashList"><div class="empty-tip">加载中...</div></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" id="btnTrashClear" style="margin-right:auto">清空回收站</button>
        <button type="button" class="btn btn-default" id="trashMaskCancel">关闭</button>
      </div>
    </div>
  </div>

  <style>
    .enroll-chip{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;font-size:11px;vertical-align:middle;font-weight:500;color:#fff;background:#6b7280;}
    .enroll-leave{background:#f59e0b;}
    .enroll-quit{background:#dc2626;}
    .enroll-transfer{background:#3b82f6;}
    .enroll-graduate{background:#10b981;}
    .enroll-info{font-size:14px;padding:6px 2px;color:#374151;}
    .enroll-history{max-height:210px;overflow:auto;border:1px solid var(--line,#e5e7eb);border-radius:8px;padding:8px 10px;margin-top:6px;background:#fff;}
    .enroll-item{border-bottom:1px dashed #eee;padding:6px 2px;}
    .enroll-item:last-child{border-bottom:none;}
    .enroll-flow{font-size:13px;font-weight:500;color:#1f2937;}
    .enroll-meta{font-size:12px;color:#9ca3af;margin-top:2px;}
    .enroll-empty{color:#9ca3af;font-size:13px;text-align:center;padding:14px 0;}
    .enroll-history-title{font-size:13px;font-weight:600;color:#374151;margin:10px 0 2px;}
    .trash-top{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
    .trash-top .search-input{flex:1;}
    .trash-count{color:#6b7280;font-size:13px;white-space:nowrap;}
    .trash-list{max-height:52vh;overflow:auto;border:1px solid var(--line,#e5e7eb);border-radius:8px;}
    .trash-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid #f0f0f0;}
    .trash-item:last-child{border-bottom:none;}
    .trash-main{font-size:14px;color:#111827;}
    .trash-sub{font-size:12px;color:#9ca3af;margin-top:3px;}
    .trash-actions{display:flex;gap:6px;flex-shrink:0;}
    #batchAssignMask .modal { max-width: 620px; }
    #batchDormMask .modal { max-width: 820px; }
  </style>

  <!-- 批量分班弹窗 -->
  <div class="modal-mask" id="batchAssignMask">
    <div class="modal">
      <div class="modal-header">
        <h3>批量分班</h3>
        <button class="modal-close" id="batchAssignClose" type="button"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="batch-sum" id="batchAssignSum"></div>
        <div class="assign-pick">
          <label for="batchAssignSelect">目标班级</label>
          <select id="batchAssignSelect"></select>
        </div>
        <p class="assign-tip" id="batchAssignTip"></p>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" id="batchAssignCancel">取消</button>
          <button type="button" class="btn btn-primary" id="batchAssignSave" disabled>确认分班</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 批量分配宿舍弹窗 -->
  <div class="modal-mask" id="batchDormMask">
    <div class="modal">
      <div class="modal-header">
        <h3>批量分配宿舍</h3>
        <button class="modal-close" id="batchDormClose" type="button"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="dorm-stu" id="batchDormInfo"></div>
        <input type="text" id="batchDormSearch" class="search-input" placeholder="搜索楼栋 / 房号，快速定位宿舍" />
        <div class="dorm-pick-list" id="batchDormList"></div>
        <div class="modal-footer">
          <span id="batchDormTip" style="margin-right:auto;font-size:12px;color:#64748b"></span>
          <button type="button" class="btn btn-default" id="batchDormCancel">取消</button>
          <button type="button" class="btn btn-primary" id="batchDormSave" disabled>确认分配</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 批量操作浮动条 -->
  <div class="bulk-bar" id="bulkBar">
    <span class="bulk-count" id="bulkCount">已选 0 名学生</span>
    <span class="bulk-sep"></span>
    <button type="button" class="btn btn-sm btn-primary" id="bulkAssign">批量分班</button>
    <button type="button" class="btn btn-sm btn-outline" id="bulkDorm">批量分配宿舍</button>
    <button type="button" class="btn btn-sm btn-danger" id="bulkDelete">批量删除</button>
    <button type="button" class="btn btn-sm btn-default" id="bulkClear">取消选择</button>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <script src="/js/dialog.js"></script>
  <script src="/js/site.js"></script>
  <script src="/js/embed.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>

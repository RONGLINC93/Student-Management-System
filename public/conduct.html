<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学生管理系统 - 考勤操行</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .cd-wrap { background:#fff; border:1px solid var(--border, #e5e7eb); border-radius:14px; padding:16px 18px; }
    .cd-tabs { display:flex; gap:6px; border-bottom:1px solid #eef2f7; margin-bottom:14px; }
    .cd-tab { padding:9px 18px; cursor:pointer; font-size:14px; color:#6b7280; border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s; }
    .cd-tab:hover { color:#374151; }
    .cd-tab.active { color:#2563eb; border-color:#2563eb; font-weight:600; }
    /* 工具栏：统一控件尺寸 / 圆角 / 边框 / 聚焦态，避免左右按钮高度不一致 */
    .att-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    .att-bar > input,
    .att-bar > select {
      height: 36px; padding: 0 12px; border: 1px solid var(--border);
      border-radius: 8px; background:#fff; font-size: 13px; color: var(--text);
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .att-bar > input:focus,
    .att-bar > select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
    .att-bar > input[type="date"]::-webkit-calendar-picker-indicator { opacity: .55; padding: 4px; cursor: pointer; }
    .att-bar > input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }
    .att-bar > span { color:#94a3b8; font-size:12px; }
    .att-bar > .spacer { flex: 1; }
    .att-bar .btn {
      height: 36px; line-height: 34px; padding: 0 14px; font-size: 13px; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .att-bar .btn .btn-icon { width: 14px; height: 14px; vertical-align: -2px; margin-right: 5px; }
    /* 表格空态：垂直空间更足，文字更柔和 */
    .student-table .empty-tip { padding: 60px 16px !important; color: var(--text-light); }
    .st-select { width: auto; padding: 3px 6px; }
    .st-present { color:#15803d; } .st-late { color:#b45309; } .st-early { color:#a16207; }
    .st-leave { color:#0369a1; } .st-absent { color:#b91c1c; }
    .tag { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; }
    .tag-reward { background:#dcfce7; color:#15803d; }
    .tag-punish { background:#fee2e2; color:#b91c1c; }
    .tag-comment { background:#e0e7ff; color:#3730a3; }
    .modal .form-grid { grid-template-columns: repeat(2,1fr); }
    #modalMask .modal { max-width:600px; }
    .stat-c { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:8px; font-size:13px; }
    .stat-c b { margin-right:4px; }
    .sel-list { max-height:180px; overflow-y:auto; border:1px solid #e5e7eb; border-radius:8px; margin-top:4px; background:#fff; }
    .sel-item { padding:6px 10px; font-size:13px; cursor:pointer; }
    .sel-item:hover { background:#eff6ff; }

    /* ===== 小屏适配 ===== */
    @media (max-width: 900px) {
      .cd-wrap { padding: 14px 12px; border-radius: 12px; }
      /* 页签横向滑动，避免换行错位 */
      .cd-tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .cd-tab { flex: none; white-space: nowrap; padding: 9px 14px; }
      /* 筛选条控件加大点按区域并整行铺开 */
      .att-bar { gap: 8px; }
      .att-bar > input, .att-bar > select { flex: 1 1 138px; min-width: 0; height: 40px; }
      .att-bar > .spacer { display: none; }
      .att-bar .btn { height: 40px; line-height: 38px; flex: 1 1 auto; }
      .att-bar > input[type="date"] { flex: 1 1 100%; }
      /* 弹窗表单改单列 */
      .modal .form-grid { grid-template-columns: 1fr; }
      .sel-list { max-height: 40vh; }
    }
    @media (max-width: 640px) {
      .stat-c { gap: 8px 14px; }
      .student-table .empty-tip { padding: 40px 12px !important; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <svg class="logo-icon" data-site-logo viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <div>
          <h1 data-site-name>学生管理系统</h1>
          <p class="subtitle">日常考勤 · 奖惩 · 评语</p>
        </div>
      </div>
      <nav class="nav">
        <a href="/dashboard.html" class="nav-item">数据总览</a>
        <a href="/students.html" class="nav-item">学生档案</a>
        <a href="/classes.html" class="nav-item">班级管理</a>
        <a href="/grades.html" class="nav-item">年级管理</a>
        <a href="/teachers.html" class="nav-item">教师管理</a>
        <a href="/exams.html" class="nav-item">成绩管理</a>
        <a href="/conduct.html" class="nav-item active">考勤操行</a>
        <a href="/dorm.html" class="nav-item">宿舍管理</a>
        <a href="/allocate.html" class="nav-item">智能分班</a>
        <a href="/settings.html" class="nav-item">系统设置</a>
        <a class="site-web" data-site-web hidden target="_blank" rel="noopener" title="打开学校官网">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          <span>官网</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="cd-wrap">
      <div class="cd-tabs">
        <span class="cd-tab active" data-tab="register">考勤登记</span>
        <span class="cd-tab" data-tab="records">考勤记录</span>
        <span class="cd-tab" data-tab="conduct">操行记录</span>
      </div>

      <!-- 考勤登记 -->
      <div id="tab-register">
        <div class="att-bar">
          <input type="date" id="attDate" />
          <select id="attGrade"><option value="">全部年级</option></select>
          <select id="attClass"><option value="">请先选择班级</option></select>
          <button class="btn btn-default" id="btnLoadRoster">加载名单</button>
          <span class="spacer"></span>
          <button class="btn btn-default" id="btnSetAllP">全部出勤</button>
          <button class="btn btn-primary" id="btnSaveAtt">保存今日考勤</button>
        </div>
        <div class="stat-c" id="attStats" style="display:none"></div>
        <div class="table-wrap">
          <table class="student-table">
            <thead><tr><th style="width:52px">序号</th><th>学号</th><th>姓名</th><th>性别</th><th>考勤状态</th></tr></thead>
            <tbody id="attBody"><tr><td colspan="5" class="empty-tip">请先选择 日期 + 年级 + 班级，然后点击「加载名单」登记出勤</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- 考勤记录 -->
      <div id="tab-records" hidden>
        <div class="att-bar">
          <input type="date" id="recFrom" />
          <span>至</span>
          <input type="date" id="recTo" />
          <select id="recGrade"><option value="">全部年级</option></select>
          <select id="recClass"><option value="">全部班级</option></select>
          <button class="btn btn-default" id="btnQueryRecords">查询</button>
        </div>
        <div class="table-wrap">
          <table class="student-table">
            <thead><tr><th>日期</th><th>班级</th><th>应到</th><th>出勤</th><th>迟到</th><th>早退</th><th>请假</th><th>旷课</th><th>出勤率</th><th>操作</th></tr></thead>
            <tbody id="recBody"></tbody>
          </table>
        </div>
      </div>

      <!-- 操行记录 -->
      <div id="tab-conduct" hidden>
        <div class="att-bar">
          <input type="text" id="cSearch" class="search-input" placeholder="搜索学生 / 班级 / 标题..." style="width:240px" />
          <select id="cType">
            <option value="">全部类型</option><option value="reward">奖励</option>
            <option value="punish">处分</option><option value="comment">评语</option>
          </select>
          <button class="btn btn-default" id="btnQueryCond">查询</button>
          <span class="spacer"></span>
          <button class="btn btn-primary" id="btnAddCond"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 新增操行记录</button>
        </div>
        <div class="table-wrap">
          <table class="student-table">
            <thead><tr><th>日期</th><th>学生</th><th>班级</th><th>类型</th><th>标题</th><th>内容</th><th>操作</th></tr></thead>
            <tbody id="condBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- 操行编辑弹窗 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <div class="modal-header"><h3 id="condModalTitle">新增操行记录</h3>
        <button class="modal-close" id="modalClose"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <form class="modal-body" id="condForm">
        <input type="hidden" id="cId" />
        <div class="form-grid">
          <div class="form-row form-row-full"><label class="form-label">学生 <span class="req">*</span></label>
            <input type="text" id="cStudentSel" placeholder="输入姓名 / 学号搜索选择" autocomplete="off" />
            <div id="cStudentList" class="sel-list"></div>
          </div>
          <div class="form-row"><label class="form-label">类型</label>
            <select id="cSelType"><option value="reward">奖励</option><option value="punish">处分</option><option value="comment">评语</option></select>
          </div>
          <div class="form-row"><label class="form-label">日期</label><input type="date" id="cDate" /></div>
          <div class="form-row form-row-full"><label class="form-label">标题 <span class="req">*</span></label><input type="text" id="cTitle" placeholder="如：期中考试进步之星 / 月考作弊警告 / 期末评语" /></div>
          <div class="form-row form-row-full"><label class="form-label">详细内容</label><textarea id="cDetail" rows="3" placeholder="补充说明（选填）"></textarea></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" id="modalCancel">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/dialog.js"></script>
  <script src="/js/site.js"></script>
  <script src="/js/embed.js"></script>
  <script src="/js/conduct.js"></script>
</body>
</html>

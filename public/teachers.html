<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学生管理系统 - 教师管理</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* 表格美化：吸附表头 / 头像 / 标签化 */
    .table-scroll { max-height: 540px; max-height: calc(100vh - 340px); overflow: auto; overscroll-behavior: contain; }
    .t-table { width: 100%; min-width: 940px; border-collapse: collapse; }
    .t-table thead th {
      position: sticky; top: 0; z-index: 3;
      background: #f8fafc;
      padding: 13px 14px;
      text-align: left;
      font-size: 12.5px;
      letter-spacing: .3px;
      color: var(--text-light);
      font-weight: 600;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    .t-table tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13.5px; }
    .t-table tbody tr:last-child td { border-bottom: none; }
    .t-table tbody tr:hover td { background: #f8faff; }
    /* 教师单元：头像 + 姓名 */
    .teacher-cell { display: flex; align-items: center; gap: 10px; }
    .teacher-avatar {
      flex: 0 0 36px; width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 15px; font-weight: 700;
      box-shadow: 0 2px 6px rgba(15,23,42,.12);
    }
    .teacher-avatar.m { background: linear-gradient(135deg, #60a5fa, #2563eb); }
    .teacher-avatar.f { background: linear-gradient(135deg, #f9a8d4, #db2777); }
    .teacher-name { display: block; font-weight: 600; color: var(--text); font-size: 14px; line-height: 1.3; }
    .teacher-sub { display: block; font-size: 12px; color: var(--text-light); margin-top: 1px; font-family: 'SF Mono', 'Consolas', monospace; }
    /* 学科 / 班主任 / 状态 */
    .subj-chips { display: flex; gap: 4px; flex-wrap: wrap; }
    .subj-chip { padding: 2px 8px; border-radius: 6px; font-size: 12px; background: #f1f5f9; border: 1px solid #e2e8f0; color: #475569; white-space: nowrap; }
    .head-tag {
      display: inline-flex; align-items: center; gap: 5px;
      background: #ecfdf5; border: 1px solid #a7f3d0; color: #047857;
      padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
    }
    .head-tag svg { width: 13px; height: 13px; }
    .head-none { color: var(--text-light); font-size: 13px; }
    .t-phone { font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* 操作列 */
    .row-actions { gap: 6px; }
    .row-actions .btn-sm { height: 27px; display: inline-flex; align-items: center; gap: 4px; }
    .head-btn { background: #fff; border: 1px solid var(--border); color: #475569; }
    .head-btn svg:not(.caret) { width: 13px; height: 13px; }
    .head-btn .caret { width: 11px; height: 11px; color: #94a3b8; transition: transform .15s; }
    .head-btn.is-head { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
    .head-btn.is-head .caret { color: #34d399; }
    /* 悬浮菜单（任班主任 / 更多） */
    #ctxMenu {
      position: fixed; z-index: 200; width: 250px;
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 14px 36px rgba(15,23,42,.16);
      padding: 6px;
      opacity: 0; visibility: hidden; transform: translateY(-6px) scale(.98);
      transform-origin: top right;
      transition: opacity .16s, transform .16s;
    }
    #ctxMenu.show { opacity: 1; visibility: visible; transform: none; }
    #ctxMenu.above { transform-origin: bottom right; }
    .ctx-caption { display: flex; align-items: center; gap: 6px; padding: 6px 10px 5px; font-size: 11px; color: var(--text-light); letter-spacing: .4px; }
    .ctx-caption svg { width: 13px; height: 13px; color: var(--text-light); flex: none; }
    .ctx-item {
      display: flex; align-items: center; gap: 8px; width: 100%;
      border: 0; background: transparent; padding: 8px 10px; border-radius: 8px;
      font-size: 13px; color: var(--text); cursor: pointer; text-align: left;
    }
    .ctx-item svg { width: 15px; height: 15px; color: #94a3b8; flex: none; }
    .ctx-item .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctx-item .hint { flex: none; font-size: 11px; color: var(--text-light); }
    .ctx-item:hover:not(:disabled) { background: #eef2ff; }
    .ctx-item:hover:not(:disabled) svg { color: var(--primary); }
    .ctx-item.is-cur { color: #047857; }
    .ctx-item.is-cur svg, .ctx-item.is-cur .hint { color: #34d399; }
    .ctx-item.is-cur:hover { background: #ecfdf5; }
    .ctx-item.danger { color: var(--danger); }
    .ctx-item.danger svg { color: var(--danger); }
    .ctx-item.danger:hover:not(:disabled) { background: #fef2f2; }
    .ctx-item:disabled { opacity: .5; cursor: default; }
    .ctx-item:disabled:hover { background: transparent; }
    .ctx-list { max-height: 250px; overflow: auto; }
    .ctx-divider { height: 1px; background: var(--border); margin: 5px 4px; }
    #modalMask .modal { max-width: 560px; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <svg class="logo-icon" data-site-logo viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <div>
          <h1 data-site-name>学生管理系统</h1>
          <p class="subtitle">教师档案 · 班主任管理</p>
        </div>
      </div>
      <nav class="nav">
        <a href="/" class="nav-item">数据总览</a>
        <a href="/students.html" class="nav-item">学生档案</a>
        <a href="/classes.html" class="nav-item">班级管理</a>
        <a href="/grades.html" class="nav-item">年级管理</a>
        <a href="/teachers.html" class="nav-item active">教师管理</a>
        <a href="/exams.html" class="nav-item">成绩管理</a>
        <a href="/conduct.html" class="nav-item">考勤操行</a>
        <a href="/dorm.html" class="nav-item">宿舍管理</a>
        <a href="/allocate.html" class="nav-item">智能分班</a>
        <a href="/settings.html" class="nav-item">系统设置</a>
        <a class="site-web" data-site-web hidden target="_blank" rel="noopener" title="打开学校官网">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          <span>官网</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="stats">
      <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">教师总数</div></div>
      <div class="stat-card"><div class="stat-num" id="statMale">0</div><div class="stat-label">男教师</div></div>
      <div class="stat-card"><div class="stat-num" id="statFemale">0</div><div class="stat-label">女教师</div></div>
      <div class="stat-card"><div class="stat-num" id="statHead">0</div><div class="stat-label">担任班主任</div></div>
    </section>

    <section class="toolbar">
      <div class="toolbar-left">
        <input type="text" id="searchInput" class="search-input" placeholder="搜索姓名 / 工号 / 电话 / 学科..." />
        <select id="genderFilter" class="grade-filter">
          <option value="">全部性别</option><option value="男">男</option><option value="女">女</option>
        </select>
        <select id="headFilter" class="grade-filter">
          <option value="">全部状态</option>
          <option value="head">担任班主任</option>
          <option value="none">未担任班主任</option>
        </select>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-primary" id="btnAdd"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 添加教师</button>
      </div>
    </section>

    <section class="table-wrap">
      <div class="table-scroll">
        <table class="t-table">
          <thead>
            <tr><th>教师</th><th>性别</th><th>任教学科</th><th>职称/职务</th><th>联系电话</th><th>入职年份</th><th>班主任（班级）</th><th>操作</th></tr>
          </thead>
          <tbody id="tBody"><tr><td colspan="8" class="empty-tip">加载中...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- 教师编辑弹窗 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">添加教师</h3>
        <button class="modal-close" id="modalClose"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <form class="modal-body" id="teacherForm">
        <input type="hidden" id="fId" />
        <div class="form-grid">
          <div class="form-row"><label class="form-label">工号</label><input type="text" id="fTeacherNo" placeholder="如：T2024001" /></div>
          <div class="form-row"><label class="form-label">姓名 <span class="req">*</span></label><input type="text" id="fName" required placeholder="教师姓名" /></div>
          <div class="form-row"><label class="form-label">性别</label>
            <select id="fGender"><option value="男">男</option><option value="女">女</option></select>
          </div>
          <div class="form-row"><label class="form-label">任教学科</label><input type="text" id="fSubject" list="subjectList" placeholder="如：语文" /></div>
          <div class="form-row"><label class="form-label">职称/职务</label>
            <select id="fTitle">
              <option value="">请选择</option>
              <option value="高级教师">高级教师</option>
              <option value="一级教师">一级教师</option>
              <option value="二级教师">二级教师</option>
              <option value="三级教师">三级教师</option>
              <option value="教研组长">教研组长</option>
              <option value="年级组长">年级组长</option>
              <option value="德育主任">德育主任</option>
            </select>
          </div>
          <div class="form-row"><label class="form-label">入职年份</label><input type="text" id="fJoinYear" placeholder="如：2018" /></div>
          <div class="form-row"><label class="form-label">联系电话</label><input type="text" id="fPhone" placeholder="手机号/固话" /></div>
          <div class="form-row form-row-full"><label class="form-label">备注</label><input type="text" id="fRemark" placeholder="备注（如主要任课班级、荣誉等）" /></div>
        </div>
        <datalist id="subjectList"></datalist>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" id="modalCancel">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 行操作悬浮菜单（设置/改任班主任） -->
  <div id="ctxMenu" hidden></div>

  <div class="toast" id="toast"></div>

  <script src="/js/dialog.js"></script>
  <script src="/js/site.js"></script>
  <script src="/js/embed.js"></script>
  <script src="/js/teachers.js"></script>
</body>
</html>

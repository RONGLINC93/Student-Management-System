<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="RONGLINC (chenronglin1993@hotmail.com)" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>学生管理系统 - 课程表</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/timetable.css" />
  <style>
    /* 排课页专用：工具栏宽度与状态提示 */
    .tt-toolbar-select { min-width: 190px; }
    .tt-toolbar-term { width: 230px; }
    @media (max-width: 900px) {
      .tt-toolbar-select, .tt-toolbar-term { width: 100%; min-width: 0; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <svg class="logo-icon" data-site-logo viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        <div>
          <h1 data-site-name>学生管理系统</h1>
          <p class="subtitle">课程表 · 教务处按班级排课，教师 / 学生随时查看</p>
        </div>
      </div>
      <nav class="nav">
        <a href="/dashboard.html" class="nav-item">数据总览</a>
        <a href="/students.html" class="nav-item">学生档案</a>
        <a href="/classes.html" class="nav-item">班级管理</a>
        <a href="/grades.html" class="nav-item">年级管理</a>
        <a href="/teachers.html" class="nav-item">教师管理</a>
        <a href="/exams.html" class="nav-item">成绩管理</a>
        <a href="/analysis.html" class="nav-item">成绩分析</a>
        <a href="/conduct.html" class="nav-item">考勤操行</a>
        <a href="/leaves.html" class="nav-item">请假管理</a>
        <a href="/announcements.html" class="nav-item">通知公告</a>
        <a href="/timetable.html" class="nav-item active">课程表</a>
        <a href="/dorm.html" class="nav-item">宿舍管理</a>
        <a href="/allocate.html" class="nav-item">智能分班</a>
        <a href="/settings.html" class="nav-item">系统设置</a>
        <a class="site-web" data-site-web hidden target="_blank" rel="noopener" title="打开学校官网">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          <span>官网</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div class="card-body">
        <div class="toolbar">
          <div class="toolbar-left">
            <select class="grade-filter tt-toolbar-select" id="classSel" title="选择要排课的班级"></select>
            <input type="text" class="search-input tt-toolbar-term" id="termInput" maxlength="40" placeholder="学期名称，如 2026-2027 学年 第一学期" />
          </div>
          <div class="toolbar-right">
            <button class="btn btn-outline" id="btnMeta" type="button">节次设置</button>
            <button class="btn btn-outline" id="btnCopy" type="button">复制到其他班级</button>
            <button class="btn btn-outline" id="btnCsv" type="button">导出 CSV</button>
            <button class="btn btn-outline" id="btnPrint" type="button">打印</button>
            <button class="btn btn-danger" id="btnClear" type="button">清空本班</button>
            <button class="btn btn-primary" id="btnSave" type="button">保存课表</button>
          </div>
        </div>

        <div class="tt-bar">
          <div class="tt-bar-l">
            <b id="ttClassTitle">—</b>
            <span class="tt-sub" id="ttSub"></span>
          </div>
          <div class="tt-legend">
            <span><i class="tt-dot" style="background:#fff7ed;border:1px solid #fdba74"></i>排课冲突</span>
            <span class="tt-dirty" id="ttDirty" hidden>● 有未保存的改动</span>
          </div>
        </div>

        <div class="tt-alert" id="conflictBox" hidden></div>
        <div id="gridHost"><div class="tt-empty">正在加载…</div></div>
        <p class="tt-tip">点击任意单元格即可为该时段安排课程（科目 / 教师 / 教室）；修改完成后点击「保存课表」。同一教师或同一教室在同一时间被排进多个班级时会提示冲突。</p>
      </div>
    </div>
  </main>

  <!-- 单元格排课弹窗 -->
  <div class="modal-mask" id="cellMask">
    <div class="modal">
      <div class="modal-header">
        <h3 id="cellTitle">安排课程</h3>
        <button class="modal-close" id="cellX" type="button">×</button>
      </div>
      <div class="modal-body">
        <div class="tt-warn" id="cellWarn" hidden></div>
        <div class="form-row">
          <label class="form-label">科目 *</label>
          <input type="text" id="cSubject" list="subjectList" maxlength="20" placeholder="如：语文 / 数学" />
          <datalist id="subjectList"></datalist>
        </div>
        <div class="form-row"><label class="form-label">任课教师</label><select id="cTeacher"></select></div>
        <div class="form-row"><label class="form-label">教室（可选）</label><input type="text" id="cRoom" maxlength="20" placeholder="如：教学楼 301 / 操场" /></div>
        <div class="form-row"><label class="form-label">本班常用（点击快速填入）</label><div class="tt-quick" id="cQuick"></div></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" id="cClear">清除本节</button>
        <button type="button" class="btn btn-default" id="cCancel">取消</button>
        <button type="button" class="btn btn-primary" id="cOk">确定</button>
      </div>
    </div>
  </div>

  <!-- 课表设置（学期 / 节次 / 上课日） -->
  <div class="modal-mask" id="metaMask">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3>课表设置 · 学期 / 节次 / 上课日</h3>
        <button class="modal-close" id="metaX" type="button">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row"><label class="form-label">学期名称</label><input type="text" id="mTerm" maxlength="40" placeholder="如：2026-2027 学年 第一学期" /></div>
        <div class="form-row"><label class="form-label">上课日</label><div class="tt-days" id="mDays"></div></div>
        <div class="form-row">
          <label class="form-label">节次与时间</label>
          <div class="tt-periods" id="mPeriods"></div>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
            <button type="button" class="btn btn-sm btn-outline" id="mAddPeriod">＋ 增加一节</button>
            <button type="button" class="btn btn-sm btn-outline" id="mDelPeriod">－ 删除末节</button>
          </div>
        </div>
        <p class="tt-tip">时间可留空。减少节次或取消上课日时，对应时段已排的课程会一并删除，请谨慎调整。</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" id="metaCancel">取消</button>
        <button type="button" class="btn btn-primary" id="metaSave">保存设置</button>
      </div>
    </div>
  </div>

  <!-- 复制课表 -->
  <div class="modal-mask" id="copyMask">
    <div class="modal">
      <div class="modal-header">
        <h3>复制课表</h3>
        <button class="modal-close" id="copyX" type="button">×</button>
      </div>
      <div class="modal-body">
        <p class="tt-tip" id="copyFrom" style="margin-top:0"></p>
        <div class="form-row">
          <label class="form-label">复制到（可多选）</label>
          <div class="tt-picker" id="copyList"></div>
        </div>
        <label class="tt-check"><input type="checkbox" id="copyOverwrite" /> 覆盖目标班级已有课表</label>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" id="copyCancel">取消</button>
        <button type="button" class="btn btn-primary" id="copyOk">开始复制</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/js/site.js"></script>
  <script src="/js/dialog.js"></script>
  <script src="/js/embed.js"></script>
  <script src="/js/timetable.js"></script>
</body>
</html>

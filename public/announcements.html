<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学生管理系统 - 通知公告</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .ann-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
    .ann-grid{display:flex;flex-direction:column;gap:12px;margin-top:6px;}
    .ann-item{border:1px solid var(--line,#e5e7eb);border-radius:12px;padding:14px 16px;background:#fff;display:flex;gap:14px;align-items:flex-start;}
    .ann-item.pinned{border-color:#f59e0b;box-shadow:0 0 0 1px #fcd34d inset;}
    .ann-main{flex:1;min-width:0;}
    .ann-title{font-size:15px;font-weight:600;color:#111827;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .ann-content{color:#4b5563;font-size:13px;line-height:1.7;margin-top:6px;white-space:pre-wrap;word-break:break-word;}
    .ann-meta{color:#9ca3af;font-size:12px;margin-top:8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
    .scope{display:inline-block;padding:1px 8px;border-radius:8px;font-size:12px;background:#eef2ff;color:#4f46e5;}
    .scope.all{background:#ecfdf5;color:#059669;}
    .pin{display:inline-block;padding:1px 8px;border-radius:8px;font-size:12px;background:#fff7e6;color:#b45309;}
    .ann-ops{display:flex;gap:6px;flex-shrink:0;}
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <svg class="logo-icon" data-site-logo viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <div>
          <h1 data-site-name>学生管理系统</h1>
          <p class="subtitle">通知公告 · 面向全校 / 年级 / 班级定向发布</p>
        </div>
      </div>
      <nav class="nav">
        <a href="/" class="nav-item">数据总览</a>
        <a href="/students.html" class="nav-item">学生档案</a>
        <a href="/classes.html" class="nav-item">班级管理</a>
        <a href="/grades.html" class="nav-item">年级管理</a>
        <a href="/teachers.html" class="nav-item">教师管理</a>
        <a href="/exams.html" class="nav-item">成绩管理</a>
        <a href="/analysis.html" class="nav-item">成绩分析</a>
        <a href="/conduct.html" class="nav-item">考勤操行</a>
        <a href="/leaves.html" class="nav-item">请假管理</a>
        <a href="/announcements.html" class="nav-item active">通知公告</a>
        <a href="/dorm.html" class="nav-item">宿舍管理</a>
        <a href="/allocate.html" class="nav-item">智能分班</a>
        <a href="/settings.html" class="nav-item">系统设置</a>
        <a class="site-web" data-site-web hidden target="_blank" rel="noopener" title="打开学校官网">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          <span>官网</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div class="card-body">
        <div class="toolbar">
          <div class="toolbar-left">
            <input type="text" class="search-input" id="kw" placeholder="搜索标题 / 内容" />
          </div>
          <div class="toolbar-right">
            <button class="btn btn-primary" id="btnNew" type="button">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              发布公告
            </button>
          </div>
        </div>
        <div class="empty-tip" id="annEmpty" style="display:none">暂无公告</div>
        <div class="ann-grid" id="annList"></div>
      </div>
    </div>
  </main>

  <!-- 公告编辑弹窗 -->
  <div class="modal-mask" id="editMask">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 id="editTitle">发布公告</h3>
        <button class="modal-close" id="editX" type="button">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row"><label class="form-label">标题 *</label><input type="text" id="aTitle" maxlength="100" placeholder="公告标题" /></div>
        <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr">
          <div class="form-row"><label class="form-label">面向范围 *</label>
            <select id="scopeType">
              <option value="all">全校</option>
              <option value="grade">指定年级</option>
              <option value="class">指定班级</option>
            </select>
          </div>
          <div class="form-row"><label class="form-label">范围对象</label><select id="scopeValue"><option value="">—</option></select></div>
          <div class="form-row"><label class="form-label">截止日期（可选）</label><input type="date" id="validTo" /></div>
        </div>
        <div class="form-row">
          <label style="display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--text);cursor:pointer;white-space:nowrap;user-select:none">
            <input type="checkbox" id="pinned" style="width:16px;height:16px;accent-color:var(--primary);cursor:pointer" /> 置顶公告
          </label>
        </div>
        <div class="form-row"><label class="form-label">内容 *</label><textarea id="aContent" rows="8" placeholder="公告正文，支持多行文本"></textarea></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" id="editCancel">取消</button>
        <button type="button" class="btn btn-primary" id="btnSave">发布</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/js/site.js"></script>
  <script src="/js/dialog.js"></script>
  <script src="/js/embed.js"></script>
  <script src="/js/announcements.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学生管理系统 - 请假管理</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .sum-chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px 0;}
    .sum-chip{flex:1;min-width:150px;border:1px solid var(--line,#e5e7eb);border-radius:12px;padding:12px 16px;cursor:pointer;background:#fff;text-align:left;font-family:inherit;}
    .sum-chip.active{border-color:var(--primary,#2563eb);box-shadow:0 0 0 1px var(--primary,#2563eb);}
    .sum-chip b{display:block;font-size:22px;line-height:1.3;color:#111827;}
    .sum-chip span{color:#6b7280;font-size:13px;}
    .sum-chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}
    .tag{display:inline-block;padding:2px 9px;border-radius:9px;font-size:12px;line-height:18px;white-space:nowrap;}
    .tag-p{background:#fff7e6;color:#b45309;}
    .tag-a{background:#e8f7ee;color:#15803d;}
    .tag-r{background:#fdeaea;color:#b91c1c;}
    .type-line{font-size:12px;color:#6b7280;}
    .review-info{font-size:14px;color:#374151;line-height:1.8;margin-bottom:10px;}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
    /* 学生搜索选择 */
    .stu-picker{position:relative;}
    .stu-sug{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line,#e5e7eb);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.12);max-height:220px;overflow:auto;z-index:60;}
    .stu-sug[hidden]{display:none;}
    .sug-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;font-size:14px;color:#111827;border-bottom:1px solid #f3f4f6;}
    .sug-item:last-child{border-bottom:none;}
    .sug-item:hover,.sug-item.on{background:#eff6ff;}
    .sug-no{color:#6b7280;font-weight:400;font-size:12px;margin-left:4px;}
    .sug-info{color:#9ca3af;font-size:12px;white-space:nowrap;}
    .sug-empty{padding:10px 12px;color:#9ca3af;font-size:13px;text-align:center;}
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <svg class="logo-icon" data-site-logo viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>
        <div>
          <h1 data-site-name>学生管理系统</h1>
          <p class="subtitle">请假管理 · 学生在线请假与审批</p>
        </div>
      </div>
      <nav class="nav">
        <a href="/" class="nav-item">数据总览</a>
        <a href="/students.html" class="nav-item">学生档案</a>
        <a href="/classes.html" class="nav-item">班级管理</a>
        <a href="/grades.html" class="nav-item">年级管理</a>
        <a href="/teachers.html" class="nav-item">教师管理</a>
        <a href="/exams.html" class="nav-item">成绩管理</a>
        <a href="/analysis.html" class="nav-item">成绩分析</a>
        <a href="/conduct.html" class="nav-item">考勤操行</a>
        <a href="/leaves.html" class="nav-item active">请假管理</a>
        <a href="/announcements.html" class="nav-item">通知公告</a>
        <a href="/dorm.html" class="nav-item">宿舍管理</a>
        <a href="/allocate.html" class="nav-item">智能分班</a>
        <a href="/settings.html" class="nav-item">系统设置</a>
        <a class="site-web" data-site-web hidden target="_blank" rel="noopener" title="打开学校官网">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          <span>官网</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="sum-chips" id="sumChips"></div>

    <div class="card">
      <div class="card-body">
        <div class="toolbar">
          <div class="toolbar-left">
            <input type="text" class="search-input" id="kw" placeholder="搜索姓名 / 学号 / 班级 / 事由" />
            <select id="gradeFilter" class="grade-filter"><option value="">全部年级</option></select>
          </div>
          <div class="toolbar-right">
            <button class="btn btn-default" id="btnExport" type="button">导出 CSV</button>
            <button class="btn btn-primary" id="btnNew" type="button">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              代登记请假
            </button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="student-table">
            <thead>
              <tr>
                <th style="min-width:130px">学生</th>
                <th>班级</th>
                <th>类型</th>
                <th style="min-width:210px">起止日期</th>
                <th>事由</th>
                <th>来源</th>
                <th style="min-width:150px">提交时间</th>
                <th>审批</th>
                <th style="width:160px">操作</th>
              </tr>
            </thead>
            <tbody id="leafBody"></tbody>
          </table>
          <div class="empty-tip" id="leafEmpty" style="display:none">暂无请假记录</div>
        </div>
      </div>
    </div>
  </main>

  <!-- 代登记弹窗 -->
  <div class="modal-mask" id="newMask">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3>代登记请假</h3>
        <button class="modal-close" id="newX" type="button">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label class="form-label">学生 <span class="req">*</span></label>
          <div class="stu-picker">
            <input type="text" id="stuSearch" autocomplete="off" placeholder="输入学号 / 姓名 / 班级搜索" />
            <input type="hidden" id="stuSel" />
            <div class="stu-sug" id="stuSug" hidden></div>
          </div>
        </div>
        <div class="form-row"><label class="form-label">请假类型 <span class="req">*</span></label><select id="typeSel"></select></div>
        <div class="form-grid">
          <div class="form-row"><label class="form-label">开始日期 <span class="req">*</span></label><input type="date" id="startDate" /></div>
          <div class="form-row"><label class="form-label">结束日期 <span class="req">*</span></label><input type="date" id="endDate" /></div>
        </div>
        <div class="form-row"><label class="form-label">请假天数</label><span id="daysTip" style="color:#374151;font-size:14px;line-height:36px">自动计算</span></div>
        <div class="form-row"><label class="form-label">事由</label><textarea id="reason" rows="2" placeholder="请假事由（选填）"></textarea></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" id="newCancel">取消</button>
        <button type="button" class="btn btn-primary" id="btnSave">提交（待审批）</button>
      </div>
    </div>
  </div>

  <!-- 审批弹窗 -->
  <div class="modal-mask" id="reviewMask">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3>请假审批</h3>
        <button class="modal-close" id="reviewX" type="button">×</button>
      </div>
      <div class="modal-body">
        <div class="review-info" id="reviewInfo"></div>
        <div class="form-row"><label class="form-label">审批意见</label><textarea id="reviewNote" rows="2" placeholder="同意 / 驳回意见（选填）"></textarea></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="btnReject">驳回</button>
        <button type="button" class="btn btn-success" id="btnApprove">批准</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/js/site.js"></script>
  <script src="/js/dialog.js"></script>
  <script src="/js/embed.js"></script>
  <script src="/js/leaves.js"></script>
</body>
</html>
